<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>2027 Friends Trip Vote</title>
  <meta name="description" content="A quick quiz to vote on the 2027 friends and family resort trip.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800;900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#171717;--paper:#fff8ee;--muted:#6e6258;--line:#ead9c4;--coral:#ff4f5f;--sun:#ffb000;--navy:#142238;--aqua:#19bbb6;--green:#d8ff76;--card:#fffdf8;--shadow:0 24px 80px rgba(20,34,56,.16)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% -5%,rgba(255,176,0,.32),transparent 34%),radial-gradient(circle at 95% 5%,rgba(25,187,182,.2),transparent 34%),linear-gradient(180deg,#fff8ee,#f6ead8);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}.shell{width:min(560px,calc(100% - 28px));margin:0 auto;padding:24px 0 34px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.eyebrow{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.6);border-radius:999px;padding:8px 11px;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.eyebrow:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--coral)}.link{color:var(--navy);font-size:12px;font-weight:900;text-decoration:none;border-bottom:2px solid rgba(20,34,56,.18)}.card{background:rgba(255,253,248,.9);border:1px solid var(--line);border-radius:34px;box-shadow:var(--shadow);overflow:hidden;backdrop-filter:blur(16px)}.hero{padding:26px 22px 0}.progress{height:8px;background:#efe0cc;border-radius:99px;overflow:hidden;margin-bottom:22px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--coral),var(--sun));border-radius:99px;transition:width .35s cubic-bezier(.16,1,.3,1)}.step-label{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--coral);margin-bottom:10px}.question{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(42px,11vw,62px);line-height:.9;letter-spacing:-.045em;margin:0}.sub{font-size:16px;line-height:1.3;color:var(--muted);margin:12px 0 0}.body{padding:22px}.options{display:grid;gap:10px}.option{width:100%;text-align:left;border:1px solid var(--line);background:white;border-radius:22px;padding:15px 15px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;cursor:pointer;transition:transform .18s ease,border .18s ease,box-shadow .18s ease}.option:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(20,34,56,.08)}.option.selected{border-color:var(--coral);box-shadow:0 0 0 4px rgba(255,79,95,.12);background:#fffaf7}.option b{display:block;font-size:16px;line-height:1.05}.option span{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-top:4px}.chip{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;border-radius:999px;background:var(--green);padding:6px 8px;white-space:nowrap}.field input{width:100%;border:1px solid var(--line);background:white;border-radius:22px;padding:16px;color:var(--ink);outline:none}.field input:focus{border-color:var(--coral);box-shadow:0 0 0 4px rgba(255,79,95,.12)}.nav{display:flex;justify-content:space-between;gap:10px;padding:0 22px 22px}.btn{border:0;border-radius:999px;padding:14px 17px;font-weight:900;cursor:pointer;background:var(--navy);color:white}.btn.primary{background:var(--coral);box-shadow:0 10px 30px rgba(255,79,95,.26)}.btn.ghost{background:white;color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn:disabled{opacity:.4;cursor:not-allowed}.summary{display:grid;gap:10px}.summary-row{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);padding:10px 0}.summary-row span{color:var(--muted);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}.summary-row b{text-align:right}.leaderboard{display:grid;gap:10px}.result{background:white;border:1px solid var(--line);border-radius:18px;padding:12px}.result-top{display:flex;justify-content:space-between;font-weight:900;gap:10px}.track{height:9px;background:#efe0cc;border-radius:99px;overflow:hidden;margin-top:9px}.fill{height:100%;background:linear-gradient(90deg,var(--coral),var(--sun));border-radius:99px}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.mini div{background:white;border:1px solid var(--line);border-radius:16px;padding:10px}.mini b{display:block;font-size:20px}.mini span{font-size:10px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.06em}.toast{position:fixed;left:14px;right:14px;bottom:14px;background:var(--navy);color:white;border-radius:20px;padding:14px 16px;font-weight:800;display:none}.toast.show{display:block}.fine{font-size:12px;color:var(--muted);font-weight:700;text-align:center;margin:14px 0 0}@media(max-width:520px){.shell{width:calc(100% - 20px);padding-top:14px}.question{font-size:48px}.hero{padding:22px 18px 0}.body{padding:18px}.nav{padding:0 18px 18px}.option{grid-template-columns:1fr}.chip{width:max-content}.top{padding:0 4px}.mini{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="top"><span class="eyebrow">2027 friends trip vote</span><a class="link" href="https://codyplofker.github.io/jrb-docs/personal/travel/family-resort-shortlist-2027/presentation.html">Pitch deck</a></div>
    <section class="card" id="app" aria-live="polite">
      <div class="hero"><div class="progress"><div class="bar" id="progress"></div></div><div class="step-label" id="stepLabel"></div><h1 class="question" id="question"></h1><p class="sub" id="sub"></p></div>
      <div class="body" id="body"></div>
      <div class="nav"><button class="btn ghost" id="back">Back</button><button class="btn primary" id="next">Next</button></div>
    </section>
    <p class="fine">No login. Same phone can update its vote later.</p>
  </main>
  <div class="toast" id="toast"></div>
<script>
const resorts=[
  {id:'dreams',name:'Dreams Playa Mujeres',tag:'Best default',why:'Cancun access, kids club 3+, teen zone'},
  {id:'finest',name:'Finest Playa Mujeres',tag:'Most polished',why:'Upscale Cancun, calmer adult feel'},
  {id:'beaches',name:'Beaches Turks and Caicos',tag:'Best kids machine',why:'Waterpark, childcare, Grace Bay'},
  {id:'clubmed-punta',name:'Club Med Punta Cana',tag:'Active families',why:'Sports, clubs, easy PUJ transfer'},
  {id:'tyler',name:'Tyler Place',tag:'Camp magic',why:'Lake + baby-through-teen programs'},
  {id:'rocking',name:'Rocking Horse Ranch',tag:'Easy drive',why:'Horses, waterpark, meals'}
];
const steps=[
  {key:'name',label:'Start',q:'Who is voting?',sub:'Put a name or family name so the group can sanity-check the results.',type:'input',placeholder:'e.g. Cody + Payal'},
  {key:'lane',label:'Question 1',q:'What trip lane sounds best?',sub:'This decides whether we bias toward beach resort or family-camp energy.',options:[['Warm beach all-inclusive','Pool, beach, kids club, drinks'],['Cooler family-camp','Lake, activities, easier summer weather'],['Either if the group is happy','I am flexible']]},
  {key:'vibe',label:'Question 2',q:'What is your vacation persona?',sub:'Be honest. This is how we avoid booking the wrong kind of “fun.”',options:[['Kids occupied, adults relaxed','The core mission'],['Maximum kid fun','Waterpark / clubs / chaos'],['Most polished / least chaotic','Nicer rooms, better food, calmer scene'],['Best value / easiest logistics','Make the travel and bill sane'],['Campy and active is fine','Activities > beach chair']]},
  {key:'budget',label:'Question 3',q:'How spicy can the budget get?',sub:'Directional only — we will still quote the finalists properly.',options:[['Value matters','Price can break the tie'],['Normal vacation spend','Open to the obvious good option'],['YOLO if it is clearly better','If it solves the week, fine']]},
  {key:'travel',label:'Question 4',q:'How much travel pain is acceptable?',sub:'This matters because the group is coming from different cities.',options:[['Direct or easy one-stop only','Protect day one'],['One stop is fine','Reasonable inconvenience allowed'],["I'll travel if the resort is worth it",'Best place wins']]},
  {key:'first',label:'Final rank',q:'Pick your #1 resort.',sub:'Your favorite gets the most points.',resortPick:1},
  {key:'second',label:'Final rank',q:'Pick your #2 resort.',sub:'Choose the runner-up.',resortPick:2},
  {key:'third',label:'Final rank',q:'Pick your #3 resort.',sub:'Last required pick. We will score the rest underneath.',resortPick:3},
  {key:'review',label:'Review',q:'Ready to submit?',sub:'You can go back and change anything before saving.',type:'review'},
  {key:'results',label:'Results',q:'Group leaderboard',sub:'Live results update as people vote.',type:'results'}
];
let index=0; const state={}; const tokenKey='friendsTripVoteToken';
const $=id=>document.getElementById(id); const chosenIds=()=>['first','second','third'].map(k=>state[k]).filter(Boolean);
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2800)}
function optionButton(value,detail,selected,extra=''){return `<button class="option ${selected?'selected':''}" data-value="${encodeURIComponent(value)}"><span><b>${value}</b>${detail?`<span>${detail}</span>`:''}</span>${extra}</button>`}
function render(){const s=steps[index]; $('stepLabel').textContent=s.label; $('question').textContent=s.q; $('sub').textContent=s.sub||''; $('progress').style.width=`${Math.max(6,(index+1)/steps.length*100)}%`; $('back').disabled=index===0; $('next').textContent=s.type==='review'?'Submit vote':s.type==='results'?'Refresh':'Next'; $('next').style.display=s.resortPick||s.options||s.type==='input'||s.type==='review'||s.type==='results'?'inline-block':'none'; let html=''; if(s.type==='input'){html=`<div class="field"><input id="nameInput" value="${state.name||''}" placeholder="${s.placeholder}"></div>`} else if(s.options){html=`<div class="options">${s.options.map(([v,d])=>optionButton(v,d,state[s.key]===v)).join('')}</div>`} else if(s.resortPick){const picked=new Set(chosenIds().filter(id=>id!==state[s.key])); html=`<div class="options">${resorts.filter(r=>!picked.has(r.id)).map(r=>optionButton(r.name,r.why,state[s.key]===r.id,`<em class="chip">${r.tag}</em>`).replace(encodeURIComponent(r.name),r.id)).join('')}</div>`} else if(s.type==='review'){const rank=chosenIds().map((id,i)=>`${i+1}. ${resorts.find(r=>r.id===id)?.name}`).join('<br>'); html=`<div class="summary"><div class="summary-row"><span>Name</span><b>${state.name||'Anonymous family'}</b></div><div class="summary-row"><span>Lane</span><b>${state.lane||'—'}</b></div><div class="summary-row"><span>Vibe</span><b>${state.vibe||'—'}</b></div><div class="summary-row"><span>Budget</span><b>${state.budget||'—'}</b></div><div class="summary-row"><span>Travel</span><b>${state.travel||'—'}</b></div><div class="summary-row"><span>Top 3</span><b>${rank}</b></div></div>`} else if(s.type==='results'){html='<div id="resultsBox">Loading…</div>'; setTimeout(loadResults,0)} $('body').innerHTML=html; document.querySelectorAll('.option').forEach(btn=>btn.onclick=()=>{state[s.key]=decodeURIComponent(btn.dataset.value); if(s.resortPick) state[s.key]=btn.dataset.value; setTimeout(next,80); render();}); if(s.type==='input') setTimeout(()=>$('nameInput')?.focus(),20)}
function next(){const s=steps[index]; if(s.type==='input') state.name=$('nameInput')?.value.trim(); if(s.type==='review') return submitVote(); if(s.type==='results') return loadResults(); if(index<steps.length-1){index++; render();}}
function back(){if(index>0){index--; render();}}
function ranks(){const top=chosenIds(); return [...top,...resorts.map(r=>r.id).filter(id=>!top.includes(id))];}
async function submitVote(){try{$('next').disabled=true;const res=await fetch('/api/vote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({voterToken:localStorage.getItem(tokenKey),name:state.name,lane:state.lane,vibe:state.vibe,budget:state.budget,travel:state.travel,ranks:ranks()})});const data=await res.json();if(!res.ok)throw new Error(data.error||'Vote failed');localStorage.setItem(tokenKey,data.voterToken);toast('Vote saved');index=steps.length-1;render();}catch(e){toast(e.message)}finally{$('next').disabled=false}}
async function loadResults(){const box=$('resultsBox'); if(!box) return; try{const res=await fetch('/api/results'); const data=await res.json(); if(!res.ok) throw new Error(data.error||'Could not load results'); const max=Math.max(1,...data.leaderboard.map(r=>r.points)); box.innerHTML=`<div class="mini"><div><b>${data.count}</b><span>ballots</span></div><div><b>${data.leaderboard[0]?.name?.split(' ')[0]||'—'}</b><span>leader</span></div><div><b>${data.leaderboard[0]?.firsts||0}</b><span>firsts</span></div></div><div class="leaderboard">${data.leaderboard.map(r=>`<div class="result"><div class="result-top"><span>${r.name}</span><span>${r.points} pts</span></div><div class="track"><div class="fill" style="width:${r.points/max*100}%"></div></div><p style="margin:8px 0 0;color:#6e6258;font-size:12px;font-weight:800">${r.firsts} first-place · avg rank ${r.avgRank||'—'} · ${r.tag}</p></div>`).join('')}</div>`}catch(e){box.textContent=e.message}}
$('next').onclick=next; $('back').onclick=back; render();
</script>
</body>
</html>
