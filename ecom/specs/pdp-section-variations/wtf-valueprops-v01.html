<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WTF Value Props v01 — 3-icon value strip</title>
<style>
@font-face{font-family:'Canela';src:url('https://jrb-fonts-cdn.vercel.app/fonts/Canela-Light.otf') format('opentype');font-weight:300;font-display:swap;}
@font-face{font-family:'RingsideWideWeb';src:url('https://jrb-fonts-cdn.vercel.app/fonts/RingsideWide-Book_Web.ttf') format('truetype');font-weight:400;font-display:swap;}
@font-face{font-family:'BaseMonoWideWeb';src:url('https://jrb-fonts-cdn.vercel.app/fonts/BaseMonoWideThin_6014.ttf') format('truetype');font-weight:400;font-display:swap;}
@font-face{font-family:'GeogrotesqueCondBoldWeb';src:url('https://jrb-fonts-cdn.vercel.app/fonts/Geogrotesque.ttf') format('truetype');font-weight:700;font-display:swap;}
@font-face{font-family:'ArticulatCF';src:url('https://jrb-fonts-cdn.vercel.app/fonts/ArticulatCF-DemiBold.otf') format('opentype');font-weight:600;font-display:swap;}
@font-face{font-family:'ArticulatCF';src:url('https://jrb-fonts-cdn.vercel.app/fonts/ArticulatCF-Bold.otf') format('opentype');font-weight:700;font-display:swap;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#fff;color:#000;font-family:'RingsideWideWeb',sans-serif;font-size:16px;-webkit-font-smoothing:antialiased;}
.wrap{max-width:1080px;margin:0 auto;padding:40px 20px;}
.eyebrow{font-family:'GeogrotesqueCondBoldWeb',sans-serif;text-transform:uppercase;letter-spacing:1px;font-size:12px;color:#000;text-align:center;margin-bottom:10px;}
.strip{display:grid;grid-template-columns:1fr;gap:0;border:1px solid #e5e5e5;border-radius:3px;overflow:hidden;}
.cell{display:flex;align-items:center;gap:16px;padding:22px 22px;border-bottom:1px solid #e5e5e5;}
.cell:last-child{border-bottom:none;}
.ico{width:40px;height:40px;flex:0 0 40px;display:flex;align-items:center;justify-content:center;}
.ico svg{width:34px;height:34px;}
.ctext .t{font-family:'ArticulatCF',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.3px;font-size:14px;line-height:1.2;margin-bottom:4px;}
.ctext .d{font-family:'RingsideWideWeb',sans-serif;font-size:13px;line-height:1.4;}
@media(min-width:760px){
  .strip{grid-template-columns:repeat(3,1fr);}
  .cell{flex-direction:column;text-align:center;gap:12px;border-bottom:none;border-right:1px solid #e5e5e5;padding:30px 20px;}
  .cell:last-child{border-right:none;}
}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Why you can buy with confidence</p>
  <div class="strip">
    <div class="cell">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.4"><rect x="2.5" y="6" width="19" height="13" rx="2"/><line x1="2.5" y1="10" x2="21.5" y2="10"/><line x1="6" y1="15.5" x2="11" y2="15.5"/></svg></span>
      <div class="ctext">
        <p class="t">Pay over time</p>
        <p class="d">Split it into interest-free installments with Shop Pay at checkout.</p>
      </div>
    </div>
    <div class="cell">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.4"><path d="M2.5 13.5h11v-7h-11z"/><path d="M13.5 9.5h4l3 3.5v3.5h-7z"/><circle cx="6.5" cy="18" r="1.8"/><circle cx="17.5" cy="18" r="1.8"/></svg></span>
      <div class="ctext">
        <p class="t">Free shipping</p>
        <p class="d">Free shipping on US orders over $55.</p>
      </div>
    </div>
    <div class="cell">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.4"><path d="M4 9.5a8 8 0 0 1 14-3l2 2"/><polyline points="20 4 20 8.5 15.5 8.5"/><path d="M20 14.5a8 8 0 0 1-14 3l-2-2"/><polyline points="4 20 4 15.5 8.5 15.5"/></svg></span>
      <div class="ctext">
        <p class="t">Free &amp; easy returns</p>
        <p class="d">Free returns within 30 days, free exchanges within 45.</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
