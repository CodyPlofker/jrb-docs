<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miracle Balm Buybox v05 — Trust-forward</title>
<style>
@font-face{font-family:'Canela';src:url('https://jrb-fonts-cdn.vercel.app/fonts/Canela-Light.otf') format('opentype');font-weight:300;font-display:swap;}
@font-face{font-family:'RingsideWideWeb';src:url('https://jrb-fonts-cdn.vercel.app/fonts/RingsideWide-Book_Web.ttf') format('truetype');font-weight:400;font-display:swap;}
@font-face{font-family:'BaseMonoWideWeb';src:url('https://jrb-fonts-cdn.vercel.app/fonts/BaseMonoWideThin_6014.ttf') format('truetype');font-weight:400;font-display:swap;}
@font-face{font-family:'GeogrotesqueCondBoldWeb';src:url('https://jrb-fonts-cdn.vercel.app/fonts/Geogrotesque.ttf') format('truetype');font-weight:700;font-display:swap;}
@font-face{font-family:'ArticulatCF';src:url('https://jrb-fonts-cdn.vercel.app/fonts/ArticulatCF-DemiBold.otf') format('opentype');font-weight:600;font-display:swap;}
@font-face{font-family:'ArticulatCF';src:url('https://jrb-fonts-cdn.vercel.app/fonts/ArticulatCF-Bold.otf') format('opentype');font-weight:700;font-display:swap;}

*{box-sizing:border-box;margin:0;padding:0;}
body{background:#fff;color:#000;font-family:'RingsideWideWeb',sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;}
.wrap{max-width:1180px;margin:0 auto;padding:32px 20px 56px;}
.grid{display:grid;grid-template-columns:1fr;gap:28px;}
@media(min-width:860px){.grid{grid-template-columns:1fr 1fr;gap:48px;align-items:start;}}

.gallery .main-img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:3px;background:#f8f8f8;display:block;}
.thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.thumbs img{width:62px;height:62px;object-fit:cover;border-radius:3px;border:1px solid #d4d4d4;cursor:pointer;background:#f8f8f8;}
.thumbs img.sel{border-color:#000;}

.eyebrow{font-family:'GeogrotesqueCondBoldWeb',sans-serif;text-transform:uppercase;letter-spacing:1px;font-size:12px;}
.pname{font-family:'GeogrotesqueCondBoldWeb',sans-serif;text-transform:uppercase;font-size:22px;letter-spacing:1.18px;margin:6px 0 10px;line-height:1.1;}
.rating{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.stars{display:inline-flex;gap:2px;}
.stars svg{width:16px;height:16px;}
.rcount{font-family:'RingsideWideWeb';font-size:14px;}
.price{font-family:'RingsideWideWeb';font-size:20px;margin-bottom:14px;}

/* chips as bordered tags */
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px;}
.tag{font-family:'ArticulatCF';font-weight:700;text-transform:uppercase;letter-spacing:.3px;font-size:11px;border:1.5px solid #000;border-radius:3px;padding:7px 11px;}

.shade-head{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 10px;}
.shade-label{font-family:'ArticulatCF';font-weight:700;text-transform:uppercase;letter-spacing:.3px;font-size:12px;}
.shade-current{font-family:'RingsideWideWeb';font-size:13px;}
.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;max-width:360px;}
.sw{width:28px;height:28px;border-radius:100%;border:1px solid #d4d4d4;padding:2px;cursor:pointer;background:none;display:flex;align-items:center;justify-content:center;}
.sw.sel{border-color:#000;border-width:1.5px;}
.sw i{display:block;width:24px;height:24px;border-radius:100%;}

.atc{display:flex;align-items:center;justify-content:center;width:100%;height:44px;background:#000;color:#fff;border:none;border-radius:3px;font-family:'BaseMonoWideWeb';text-transform:uppercase;font-size:13px;letter-spacing:.5px;cursor:pointer;margin-top:20px;}
.atc .pipe{opacity:.45;margin:0 12px;}

/* 3-icon value props above the fold, next to the ATC */
.vprops{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid #e5e5e5;border-radius:3px;margin-top:16px;overflow:hidden;}
.vp{display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;padding:14px 8px;}
.vp + .vp{border-left:1px solid #e5e5e5;}
.vp svg{width:22px;height:22px;}
.vp span{font-family:'RingsideWideWeb';font-size:11px;line-height:1.35;}
</style>
</head>
<body>
<div class="wrap">
  <div class="grid">
    <div class="gallery">
      <img class="main-img" id="mainImg" src="https://cdn.shopify.com/s/files/1/0424/9527/9254/products/MiracleBalm_miamibeach_1.jpg?v=1739188719&width=900" alt="Miracle Balm">
      <div class="thumbs" id="thumbs">
        <img class="sel" src="https://cdn.shopify.com/s/files/1/0424/9527/9254/products/MiracleBalm_miamibeach_1.jpg?v=1739188719&width=200" alt="">
        <img src="https://cdn.shopify.com/s/files/1/0424/9527/9254/products/Miracle_Balm_DustyRose_1.jpg?v=1739188718&width=200" alt="">
        <img src="https://cdn.shopify.com/s/files/1/0424/9527/9254/products/Miracle_Balm_SunKissed_1.jpg?v=1739188719&width=200" alt="">
        <img src="https://cdn.shopify.com/s/files/1/0424/9527/9254/products/Miracle_Balm_Bronze_1.jpg?v=1739188719&width=200" alt="">
        <img src="https://cdn.shopify.com/s/files/1/0424/9527/9254/products/miraclebalm_happyhour_1.jpg?v=1739188719&width=200" alt="">
      </div>
    </div>

    <div class="info">
      <div class="eyebrow">Highlighter · Blush · Bronzer</div>
      <h1 class="pname">Miracle Balm</h1>
      <div class="rating">
        <span class="stars" id="starsTop"></span>
        <span class="rcount">85,057 reviews · 4.23&#9733;</span>
      </div>
      <div class="price">$38.00</div>

      <!-- CHIPS AS BORDERED TAGS -->
      <div class="tags">
        <span class="tag">Sheer wash of color</span>
        <span class="tag">Melts in — never greasy</span>
        <span class="tag">A little goes a long way</span>
      </div>

      <div class="shade-head">
        <span class="shade-label">Shade — 15 available</span>
        <span class="shade-current" id="shadeCur">Miami Beach</span>
      </div>
      <div class="swatches" id="sw"></div>

      <button class="atc">Add to bag<span class="pipe">|</span>$38.00</button>

      <!-- 3-ICON VALUE PROPS ABOVE THE FOLD -->
      <div class="vprops">
        <div class="vp">
          <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.6"><rect x="2.5" y="6" width="19" height="12.5" rx="2"/><path d="M2.5 10h19"/></svg>
          <span>Pay over time<br>with Shop Pay</span>
        </div>
        <div class="vp">
          <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.6"><path d="M2.5 6h11v9h-11z"/><path d="M13.5 9h4l3 3v3h-7z"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="16.5" cy="17.5" r="1.8"/></svg>
          <span>Free shipping<br>over $50</span>
        </div>
        <div class="vp">
          <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.6"><path d="M9 5L4 10l5 5"/><path d="M4 10h10a6 6 0 0 1 6 6v1"/></svg>
          <span>Easy<br>returns</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
var SH=[["Au Naturel","#d8a784"],["Happy Hour","#d98a76"],["Dusty Rose","#cf8a7e"],["Flushed","#d07f76"],["Pinched Cheeks","#c97f7a"],["Miami Beach","#d98b66"],["Golden Hour","#e0a96b"],["Magic Hour","#d59a76"],["Chic","#c98f72"],["Pinky Bronze","#c08868"],["Bronze","#b07a52"],["Cheeky","#cc8576"],["Tawny","#a96f4c"],["Sunkissed","#bd8154"],["Cocoa Bronze","#8f5d3c"]];
var IMG={"Au Naturel":"products/MiracleBalm_AuNaturel_1.jpg?v=1739188719","Happy Hour":"products/miraclebalm_happyhour_1.jpg?v=1739188719","Dusty Rose":"products/Miracle_Balm_DustyRose_1.jpg?v=1739188718","Flushed":"files/mb_flushed_1_9d09a315-2a3e-4ab5-a6e8-61e35870284e.jpg?v=1750177846","Pinched Cheeks":"files/miraclebalm_pinchedcheeks_1_5bdaee7f-49a5-4702-b43c-6d6c87252f44.jpg?v=1739188719","Miami Beach":"products/MiracleBalm_miamibeach_1.jpg?v=1739188719","Golden Hour":"products/Miracle_Balm_GoldenHour_1.jpg?v=1739188719","Magic Hour":"products/Miracle_Balm_MagicHour_1.jpg?v=1739188719","Chic":"files/Mini_MB_PDP_Launch_1_2.jpg?v=1772536137","Pinky Bronze":"files/MiracleBalm_PinkyBronze_1_7a5080a3-e92b-4965-a8fa-883f50c50f4b.jpg?v=1739188720","Bronze":"products/Miracle_Balm_Bronze_1.jpg?v=1739188719","Cheeky":"files/Mini_MB_PDP_Launch_1_3.jpg?v=1772536202","Tawny":"products/Miracle_Balm_Tawny_1.jpg?v=1739188719","Sunkissed":"products/Miracle_Balm_SunKissed_1.jpg?v=1739188719","Cocoa Bronze":"files/miraclebalm_cocoabronze_1_e37bde81-a91b-44d3-b116-cb5d67fa8a7b.jpg?v=1739188719"};
var BASE="https://cdn.shopify.com/s/files/1/0424/9527/9254/";
var star='<svg viewBox="0 0 24 24" fill="#000"><path d="M12 2l2.9 6.3 6.9.6-5.2 4.5 1.6 6.7L12 17l-6.2 3.6 1.6-6.7L2.2 8.9l6.9-.6z"/></svg>';
document.getElementById('starsTop').innerHTML=star.repeat(4)+'<svg viewBox="0 0 24 24"><defs><linearGradient id="h5"><stop offset="23%" stop-color="#000"/><stop offset="23%" stop-color="#fff"/></linearGradient></defs><path d="M12 2l2.9 6.3 6.9.6-5.2 4.5 1.6 6.7L12 17l-6.2 3.6 1.6-6.7L2.2 8.9l6.9-.6z" fill="url(#h5)" stroke="#000"/></svg>';
var sw=document.getElementById('sw');
SH.forEach(function(s,i){var b=document.createElement('button');b.className='sw'+(i===5?' sel':'');b.innerHTML='<i style="background:'+s[1]+'"></i>';b.title=s[0];b.onclick=function(){document.querySelectorAll('.sw').forEach(function(x){x.classList.remove('sel')});b.classList.add('sel');document.getElementById('shadeCur').textContent=s[0];document.getElementById('mainImg').src=BASE+IMG[s[0]].replace('?v=','?width=900&v=');};sw.appendChild(b);});
var thumbs=document.getElementById('thumbs').children;
for(var t=0;t<thumbs.length;t++){(function(el){el.onclick=function(){for(var k=0;k<thumbs.length;k++)thumbs[k].classList.remove('sel');el.classList.add('sel');document.getElementById('mainImg').src=el.src.replace('width=200','width=900');};})(thumbs[t]);}
</script>
</body>
</html>
