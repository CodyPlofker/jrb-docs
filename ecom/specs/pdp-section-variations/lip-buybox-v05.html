<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lip Recharge Buybox v05 — Trust-forward</title>
<style>
@font-face{font-family:'Canela';src:url('https://jrb-fonts-cdn.vercel.app/fonts/Canela-Light.otf') format('opentype');font-weight:300;font-display:swap;}
@font-face{font-family:'RingsideWideWeb';src:url('https://jrb-fonts-cdn.vercel.app/fonts/RingsideWide-Book_Web.ttf') format('truetype');font-weight:400;font-display:swap;}
@font-face{font-family:'BaseMonoWideWeb';src:url('https://jrb-fonts-cdn.vercel.app/fonts/BaseMonoWideThin_6014.ttf') format('truetype');font-weight:400;font-display:swap;}
@font-face{font-family:'GeogrotesqueCondBoldWeb';src:url('https://jrb-fonts-cdn.vercel.app/fonts/Geogrotesque.ttf') format('truetype');font-weight:700;font-display:swap;}
@font-face{font-family:'ArticulatCF';src:url('https://jrb-fonts-cdn.vercel.app/fonts/ArticulatCF-DemiBold.otf') format('opentype');font-weight:600;font-display:swap;}
@font-face{font-family:'ArticulatCF';src:url('https://jrb-fonts-cdn.vercel.app/fonts/ArticulatCF-Bold.otf') format('opentype');font-weight:700;font-display:swap;}

*{box-sizing:border-box;margin:0;padding:0;}
body{background:#fff;color:#000;font-family:'RingsideWideWeb',sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;}
.wrap{max-width:1180px;margin:0 auto;padding:32px 20px 56px;}
.grid{display:grid;grid-template-columns:1fr;gap:28px;}
@media(min-width:860px){.grid{grid-template-columns:1fr 1fr;gap:48px;align-items:start;}}

.gallery .main-img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:3px;background:#f8f8f8;display:block;}
.thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.thumbs img{width:62px;height:62px;object-fit:cover;border-radius:3px;border:1px solid #d4d4d4;cursor:pointer;background:#f8f8f8;}
.thumbs img.sel{border-color:#000;}

.eyebrow{font-family:'GeogrotesqueCondBoldWeb',sans-serif;text-transform:uppercase;letter-spacing:1px;font-size:12px;}
.pname{font-family:'GeogrotesqueCondBoldWeb',sans-serif;text-transform:uppercase;font-size:22px;letter-spacing:1.18px;margin:6px 0 10px;line-height:1.1;}
.rating{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.stars{display:inline-flex;gap:2px;}
.stars svg{width:16px;height:16px;}
.rcount{font-family:'RingsideWideWeb';font-size:14px;}
.price{font-family:'RingsideWideWeb';font-size:20px;margin-bottom:14px;}

/* chips as bordered tags */
.exp{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px;}
.tag{display:inline-flex;align-items:center;gap:7px;border:1px solid #000;border-radius:3px;padding:7px 12px;font-family:'ArticulatCF';font-weight:600;text-transform:uppercase;letter-spacing:.3px;font-size:11.5px;background:#fff;}
.tag svg{width:12px;height:12px;flex:none;}
.tag.color i{width:11px;height:11px;border-radius:100%;flex:none;background:linear-gradient(135deg,#e8a9ad,#c98fb0);border:1px solid rgba(0,0,0,.2);}

.shade-head{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 10px;}
.shade-label{font-family:'ArticulatCF';font-weight:700;text-transform:uppercase;letter-spacing:.3px;font-size:12px;}
.shade-current{font-family:'RingsideWideWeb';font-size:13px;}
.swatches{display:grid;grid-template-columns:repeat(9,1fr);gap:9px;max-width:380px;}
.sw{width:28px;height:28px;border-radius:100%;border:1px solid #d4d4d4;padding:2px;cursor:pointer;background:none;display:flex;align-items:center;justify-content:center;}
.sw.sel{border-color:#000;border-width:1.5px;}
.sw i{display:block;width:24px;height:24px;border-radius:100%;}

.atc{display:flex;align-items:center;justify-content:center;width:100%;height:44px;background:#000;color:#fff;border:none;border-radius:3px;font-family:'BaseMonoWideWeb';text-transform:uppercase;font-size:13px;letter-spacing:.5px;cursor:pointer;margin-top:20px;}
.atc .pipe{opacity:.45;margin:0 12px;}

/* 3-icon value props above the fold */
.vprops{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;border-top:1px solid #e3e3e3;padding-top:16px;}
.vp{display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;}
.vp svg{width:22px;height:22px;}
.vp span{font-family:'RingsideWideWeb';font-size:11.5px;line-height:1.35;text-wrap:balance;}
</style>
</head>
<body>
<div class="wrap">
  <div class="grid">
    <!-- GALLERY -->
    <div class="gallery">
      <img class="main-img" id="mainImg" src="https://cdn.shopify.com/s/files/1/0424/9527/9254/files/Dahlia_Lip_Recharge_PDP_-_1.png?v=1772726302&width=900" alt="Lip Recharge — Dahlia">
      <div class="thumbs" id="thumbs">
        <img class="sel" src="https://cdn.shopify.com/s/files/1/0424/9527/9254/files/Dahlia_Lip_Recharge_PDP_-_1.png?v=1772726302&width=200" data-big="https://cdn.shopify.com/s/files/1/0424/9527/9254/files/Dahlia_Lip_Recharge_PDP_-_1.png?v=1772726302&width=900" alt="">
        <img src="https://cdn.shopify.com/s/files/1/0424/9527/9254/files/Dahlia_Lip_Recharge_PDP_-_2.png?v=1772726302&width=200" data-big="https://cdn.shopify.com/s/files/1/0424/9527/9254/files/Dahlia_Lip_Recharge_PDP_-_2.png?v=1772726302&width=900" alt="">
        <img src="https://cdn.shopify.com/s/files/1/0424/9527/9254/files/Dahlia_Lip_Recharge_PDP_-_3.png?v=1772726302&width=200" data-big="https://cdn.shopify.com/s/files/1/0424/9527/9254/files/Dahlia_Lip_Recharge_PDP_-_3.png?v=1772726302&width=900" alt="">
        <img src="https://cdn.shopify.com/s/files/1/0424/9527/9254/files/OTR_Lip_Recharge_PDP_-_11.jpg?v=1772135111&width=200" data-big="https://cdn.shopify.com/s/files/1/0424/9527/9254/files/OTR_Lip_Recharge_PDP_-_11.jpg?v=1772135111&width=900" alt="">
      </div>
    </div>

    <!-- INFO -->
    <div class="info">
      <div class="eyebrow">Lip Treatment</div>
      <h1 class="pname">Lip Recharge</h1>
      <div class="rating">
        <span class="stars" id="starsTop"></span>
        <span class="rcount">863 reviews &middot; 4.66&#9733;</span>
      </div>
      <div class="price">$24.00</div>

      <!-- BORDERED TAGS -->
      <div class="exp">
        <span class="tag color"><i></i>Sheer wash of color</span>
        <span class="tag"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><path d="M5 12l5 5L20 6"/></svg>Cushiony, moisturizing feel</span>
        <span class="tag"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><path d="M5 12l5 5L20 6"/></svg>Subtle vanilla-mint scent</span>
      </div>

      <!-- SHADES -->
      <div class="shade-head">
        <span class="shade-label">Shade — 9 available</span>
        <span class="shade-current" id="shadeCur">Dahlia</span>
      </div>
      <div class="swatches" id="sw"></div>

      <button class="atc">Add to bag<span class="pipe">|</span>$24.00</button>

      <!-- 3-ICON VALUE PROPS ABOVE THE FOLD -->
      <div class="vprops">
        <div class="vp">
          <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.6"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M7 14h4"/></svg>
          <span>Pay over time<br>with Shop Pay</span>
        </div>
        <div class="vp">
          <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.6"><path d="M3 7h11v8H3z"/><path d="M14 10h4l3 3v2h-7z"/><circle cx="7" cy="17.5" r="1.6"/><circle cx="17.5" cy="17.5" r="1.6"/></svg>
          <span>Free shipping<br>over $50</span>
        </div>
        <div class="vp">
          <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.6"><path d="M3 12a9 9 0 109-9"/><path d="M3 4v5h5"/></svg>
          <span>Easy 30-day<br>returns</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
var SH=[
["On The Rocks","#e7d9d2","OTR_Lip_Recharge_PDP_-_1.png?v=1773763814"],
["Petal","#e8a9ad","Petal_Lip_Recharge_PDP_-_1.png?v=1772726302"],
["Pink Lilac","#c98fb0","PinkLilac_Lip_Recharge_PDP_-_1.png?v=1772726302"],
["Champagne","#d8a98f","Champagne_Lip_Recharge_PDP_-_1.png?v=1772726302"],
["Rosé","#cf8f86","Rose_Lip_Recharge_PDP_-_1.png?v=1772726302"],
["Dahlia","#a8475a","Dahlia_Lip_Recharge_PDP_-_1.png?v=1772726302"],
["Me","#9c5a52","Me_Lip_Recharge_PDP_-_1.png?v=1772726302"],
["Sangria","#8e2f3f","Sangria_Lip_Recharge_PDP_-_1_1.png?v=1772726302"],
["Lilac","#b487b3","Lilac_Lip_Recharge_PDP_-_1_1.png?v=1772726302"]
];
var CDN="https://cdn.shopify.com/s/files/1/0424/9527/9254/files/";
var star='<svg viewBox="0 0 24 24" fill="#000"><path d="M12 2l2.9 6.3 6.9.6-5.2 4.5 1.6 6.7L12 17l-6.2 3.6 1.6-6.7L2.2 8.9l6.9-.6z"/></svg>';
document.getElementById('starsTop').innerHTML=star.repeat(4)+'<svg viewBox="0 0 24 24"><defs><linearGradient id="h5"><stop offset="66%" stop-color="#000"/><stop offset="66%" stop-color="#fff"/></linearGradient></defs><path d="M12 2l2.9 6.3 6.9.6-5.2 4.5 1.6 6.7L12 17l-6.2 3.6 1.6-6.7L2.2 8.9l6.9-.6z" fill="url(#h5)" stroke="#000"/></svg>';
var sw=document.getElementById('sw');
SH.forEach(function(s,i){var b=document.createElement('button');b.className='sw'+(i===5?' sel':'');b.innerHTML='<i style="background:'+s[1]+'"></i>';b.title=s[0];b.setAttribute('aria-label',s[0]);b.onclick=function(){document.querySelectorAll('.sw').forEach(function(x){x.classList.remove('sel')});b.classList.add('sel');document.getElementById('shadeCur').textContent=s[0];document.getElementById('mainImg').src=CDN+s[2]+'&width=900';};sw.appendChild(b);});
var thumbs=document.getElementById('thumbs').children;
for(var t=0;t<thumbs.length;t++){(function(el){el.onclick=function(){for(var k=0;k<thumbs.length;k++)thumbs[k].classList.remove('sel');el.classList.add('sel');document.getElementById('mainImg').src=el.getAttribute('data-big');};})(thumbs[t]);}
</script>
</body>
</html>
