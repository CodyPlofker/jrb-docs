<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pencil Buybox v05 — Trust-forward</title>
<style>
@font-face{font-family:'Canela';src:url('https://jrb-fonts-cdn.vercel.app/fonts/Canela-Light.otf') format('opentype');font-weight:300;font-display:swap;}
@font-face{font-family:'RingsideWideWeb';src:url('https://jrb-fonts-cdn.vercel.app/fonts/RingsideWide-Book_Web.ttf') format('truetype');font-weight:400;font-display:swap;}
@font-face{font-family:'BaseMonoWideWeb';src:url('https://jrb-fonts-cdn.vercel.app/fonts/BaseMonoWideThin_6014.ttf') format('truetype');font-weight:400;font-display:swap;}
@font-face{font-family:'GeogrotesqueCondBoldWeb';src:url('https://jrb-fonts-cdn.vercel.app/fonts/Geogrotesque.ttf') format('truetype');font-weight:700;font-display:swap;}
@font-face{font-family:'ArticulatCF';src:url('https://jrb-fonts-cdn.vercel.app/fonts/ArticulatCF-DemiBold.otf') format('opentype');font-weight:600;font-display:swap;}
@font-face{font-family:'ArticulatCF';src:url('https://jrb-fonts-cdn.vercel.app/fonts/ArticulatCF-Bold.otf') format('opentype');font-weight:700;font-display:swap;}

*{box-sizing:border-box;margin:0;padding:0;}
body{background:#fff;color:#000;font-family:'RingsideWideWeb',sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;}
.wrap{max-width:1180px;margin:0 auto;padding:32px 20px 56px;}
.grid{display:grid;grid-template-columns:1fr;gap:28px;}
@media(min-width:860px){.grid{grid-template-columns:1fr 1fr;gap:48px;align-items:start;}}

.gallery .main-img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:3px;background:#f8f8f8;display:block;}
.thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.thumbs img{width:58px;height:58px;object-fit:cover;border-radius:3px;border:1px solid #d4d4d4;cursor:pointer;background:#f8f8f8;}
.thumbs img.sel{border-color:#000;}

.eyebrow{font-family:'GeogrotesqueCondBoldWeb',sans-serif;text-transform:uppercase;letter-spacing:1px;font-size:12px;}
.pname{font-family:'GeogrotesqueCondBoldWeb',sans-serif;text-transform:uppercase;font-size:22px;letter-spacing:1.18px;margin:6px 0 10px;line-height:1.1;}
.rating{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
.stars{display:inline-flex;gap:2px;}.stars svg{width:16px;height:16px;}
.rcount{font-family:'RingsideWideWeb';font-size:14px;}
.price{font-family:'RingsideWideWeb';font-size:20px;margin-bottom:14px;}

/* bordered tag chips */
.exp{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px;}
.tag{display:inline-flex;align-items:center;border:1px solid #000;border-radius:3px;padding:7px 12px;font-family:'ArticulatCF';font-weight:600;text-transform:uppercase;letter-spacing:.3px;font-size:11px;background:#fff;}

.shade-head{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 12px;}
.shade-label{font-family:'ArticulatCF';font-weight:700;text-transform:uppercase;letter-spacing:.3px;font-size:12px;}
.shade-current{font-family:'RingsideWideWeb';font-size:13px;}
.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;max-width:360px;}
.sw{width:28px;height:28px;border-radius:100%;border:1px solid #d4d4d4;padding:2px;cursor:pointer;background:none;display:flex;align-items:center;justify-content:center;}
.sw.sel{border-color:#000;border-width:1.5px;}
.sw i{display:block;width:24px;height:24px;border-radius:100%;}

.atc{display:flex;align-items:center;justify-content:center;width:100%;height:46px;background:#000;color:#fff;border:none;border-radius:3px;font-family:'BaseMonoWideWeb';text-transform:uppercase;font-size:13px;letter-spacing:.5px;cursor:pointer;margin-top:20px;}
.atc .pipe{opacity:.45;margin:0 12px;}

/* 3-icon value props above the fold, next to ATC */
.valstrip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;border-top:1px solid #d4d4d4;padding-top:16px;}
.val{display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;}
.val svg{width:22px;height:22px;}
.val span{font-family:'RingsideWideWeb';font-size:11.5px;line-height:1.35;}
.val b{font-family:'ArticulatCF';font-weight:700;text-transform:uppercase;letter-spacing:.3px;font-size:11px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="grid">
    <!-- GALLERY -->
    <div class="gallery">
      <img class="main-img" id="mainImg" src="https://cdn.shopify.com/s/files/1/0424/9527/9254/products/JonesRoad_FacePencil_Shade1_01.jpg?v=1739188766&width=900" alt="The Face Pencil">
      <div class="thumbs" id="thumbs">
        <img class="sel" src="https://cdn.shopify.com/s/files/1/0424/9527/9254/products/JonesRoad_FacePencil_Shade1_01.jpg?v=1739188766&width=200" alt="Shade 01">
        <img src="https://cdn.shopify.com/s/files/1/0424/9527/9254/products/1R5.jpg?v=1739188766&width=200" alt="Shade 05">
        <img src="https://cdn.shopify.com/s/files/1/0424/9527/9254/products/1R10.jpg?v=1739188767&width=200" alt="Shade 10">
        <img src="https://cdn.shopify.com/s/files/1/0424/9527/9254/products/1R16.jpg?v=1739188767&width=200" alt="Shade 16">
        <img src="https://cdn.shopify.com/s/files/1/0424/9527/9254/products/1R22.jpg?v=1739188768&width=200" alt="Shade 22">
      </div>
    </div>

    <!-- INFO -->
    <div class="info">
      <div class="eyebrow">Concealer</div>
      <h1 class="pname">The Face Pencil</h1>
      <div class="rating">
        <span class="stars" id="starsTop"></span>
        <span class="rcount">25,847 reviews &middot; 4.42&#9733;</span>
      </div>
      <div class="price">$28.00</div>

      <!-- BORDERED TAG CHIPS -->
      <div class="exp">
        <span class="tag">Creamy &amp; blendable</span>
        <span class="tag">Light-to-medium coverage</span>
        <span class="tag">Warm &amp; pat to apply</span>
      </div>

      <!-- SHADES -->
      <div class="shade-head">
        <span class="shade-label">Shade &mdash; 24 available</span>
        <span class="shade-current" id="shadeCur">Shade 01</span>
      </div>
      <div class="swatches" id="sw"></div>

      <button class="atc">Add to bag<span class="pipe">|</span>$28.00</button>

      <!-- 3-ICON VALUE PROPS -->
      <div class="valstrip">
        <div class="val">
          <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.6"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M2.5 10h19"/></svg>
          <span><b>Pay over time</b><br>with Shop Pay</span>
        </div>
        <div class="val">
          <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.6"><path d="M2 7h11v8H2zM13 10h4l3 3v2h-7z"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>
          <span><b>Free shipping</b><br>over $50</span>
        </div>
        <div class="val">
          <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.6"><path d="M3 9a9 9 0 1 1 1.2 4.5"/><path d="M3 4v5h5"/></svg>
          <span><b>Easy returns</b><br>30 days</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
var SH=[["Shade 01","#ffe9d5","https://cdn.shopify.com/s/files/1/0424/9527/9254/products/JonesRoad_FacePencil_Shade1_01.jpg?v=1739188766"],["Shade 02","#fee7df","https://cdn.shopify.com/s/files/1/0424/9527/9254/products/1R2.jpg?v=1739188766"],["Shade 03","#ffefd3","https://cdn.shopify.com/s/files/1/0424/9527/9254/products/1R3.jpg?v=1739188766"],["Shade 04","#fee5c2","https://cdn.shopify.com/s/files/1/0424/9527/9254/products/1R4.jpg?v=1739188766"],["Shade 05","#fdd1b2","https://cdn.shopify.com/s/files/1/0424/9527/9254/products/1R5.jpg?v=1739188766"],["Shade 06","#fbc79a","https://cdn.shopify.com/s/files/1/0424/9527/9254/files/FacePencil_new6_1.jpg?v=1739188766"],["Shade 07","#fed7a0","https://cdn.shopify.com/s/files/1/0424/9527/9254/products/1R7.jpg?v=1739188766"],["Shade 08","#fec299","https://cdn.shopify.com/s/files/1/0424/9527/9254/products/1R8.jpg?v=1739188766"],["Shade 09","#fdcf92","https://cdn.shopify.com/s/files/1/0424/9527/9254/products/1R9.jpg?v=1739188767"],["Shade 10","#f6c995","https://cdn.shopify.com/s/files/1/0424/9527/9254/products/1R10.jpg?v=1739188767"],["Shade 11","#fbba86","https://cdn.shopify.com/s/files/1/0424/9527/9254/files/FacePencil_new11_1.jpg?v=1739188767"],["Shade 12","#fbc288","https://cdn.shopify.com/s/files/1/0424/9527/9254/products/R12.jpg?v=1739188767"],["Shade 13","#f0af6d","https://cdn.shopify.com/s/files/1/0424/9527/9254/files/FacePencil_new13_1.jpg?v=1739188767"],["Shade 14","#e5ab62","https://cdn.shopify.com/s/files/1/0424/9527/9254/products/1R14.jpg?v=1739188767"],["Shade 15","#f0a75c","https://cdn.shopify.com/s/files/1/0424/9527/9254/products/1R15.jpg?v=1739188767"],["Shade 16","#eb965d","https://cdn.shopify.com/s/files/1/0424/9527/9254/products/1R16.jpg?v=1739188767"],["Shade 17","#c47b38","https://cdn.shopify.com/s/files/1/0424/9527/9254/files/FacePencil_new17_1.jpg?v=1739188768"],["Shade 18","#a66135","https://cdn.shopify.com/s/files/1/0424/9527/9254/products/1R18.jpg?v=1739188768"],["Shade 19","#984c29","https://cdn.shopify.com/s/files/1/0424/9527/9254/products/1R19.jpg?v=1739188768"],["Shade 20","#8a512f","https://cdn.shopify.com/s/files/1/0424/9527/9254/products/1R20.jpg?v=1739188768"],["Shade 21","#783b21","https://cdn.shopify.com/s/files/1/0424/9527/9254/products/1R21.jpg?v=1739188768"],["Shade 22","#67311d","https://cdn.shopify.com/s/files/1/0424/9527/9254/products/1R22.jpg?v=1739188768"],["Shade 23","#4a2a14","https://cdn.shopify.com/s/files/1/0424/9527/9254/products/1R23.jpg?v=1739188768"],["Shade 24","#3a2111","https://cdn.shopify.com/s/files/1/0424/9527/9254/products/1R24.jpg?v=1739188768"]];
var star='<svg viewBox="0 0 24 24" fill="#000"><path d="M12 2l2.9 6.3 6.9.6-5.2 4.5 1.6 6.7L12 17l-6.2 3.6 1.6-6.7L2.2 8.9l6.9-.6z"/></svg>';
document.getElementById('starsTop').innerHTML=star.repeat(4)+'<svg viewBox="0 0 24 24"><defs><linearGradient id="h5"><stop offset="42%" stop-color="#000"/><stop offset="42%" stop-color="#fff"/></linearGradient></defs><path d="M12 2l2.9 6.3 6.9.6-5.2 4.5 1.6 6.7L12 17l-6.2 3.6 1.6-6.7L2.2 8.9l6.9-.6z" fill="url(#h5)" stroke="#000"/></svg>';
var sw=document.getElementById('sw');
SH.forEach(function(s,i){var b=document.createElement('button');b.className='sw'+(i===0?' sel':'');b.innerHTML='<i style="background:'+s[1]+'"></i>';b.title=s[0];b.onclick=function(){document.querySelectorAll('.sw').forEach(function(x){x.classList.remove('sel')});b.classList.add('sel');document.getElementById('shadeCur').textContent=s[0];document.getElementById('mainImg').src=s[2]+'&width=900';};sw.appendChild(b);});
var thumbs=document.getElementById('thumbs').children;
for(var t=0;t<thumbs.length;t++){(function(el){el.onclick=function(){for(var k=0;k<thumbs.length;k++)thumbs[k].classList.remove('sel');el.classList.add('sel');document.getElementById('mainImg').src=el.src.replace('width=200','width=900');};})(thumbs[t]);}
</script>
</body>
</html>
