<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pencil Value Props v01 — 3-icon policy value strip</title>
<style>
@font-face{font-family:'Canela';src:url('https://jrb-fonts-cdn.vercel.app/fonts/Canela-Light.otf') format('opentype');font-weight:300;font-display:swap;}
@font-face{font-family:'RingsideWideWeb';src:url('https://jrb-fonts-cdn.vercel.app/fonts/RingsideWide-Book_Web.ttf') format('truetype');font-weight:400;font-display:swap;}
@font-face{font-family:'BaseMonoWideWeb';src:url('https://jrb-fonts-cdn.vercel.app/fonts/BaseMonoWideThin_6014.ttf') format('truetype');font-weight:400;font-display:swap;}
@font-face{font-family:'GeogrotesqueCondBoldWeb';src:url('https://jrb-fonts-cdn.vercel.app/fonts/Geogrotesque.ttf') format('truetype');font-weight:700;font-display:swap;}
@font-face{font-family:'ArticulatCF';src:url('https://jrb-fonts-cdn.vercel.app/fonts/ArticulatCF-DemiBold.otf') format('opentype');font-weight:600;font-display:swap;}
@font-face{font-family:'ArticulatCF';src:url('https://jrb-fonts-cdn.vercel.app/fonts/ArticulatCF-Bold.otf') format('opentype');font-weight:700;font-display:swap;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#fff;color:#000;font-family:'RingsideWideWeb',sans-serif;font-size:16px;-webkit-font-smoothing:antialiased;}
.wrap{max-width:1080px;margin:0 auto;padding:40px 20px;}
.strip{border-top:1px solid #e5e5e5;border-bottom:1px solid #e5e5e5;display:grid;grid-template-columns:1fr;}
.item{display:flex;align-items:center;gap:14px;padding:20px 6px;border-bottom:1px solid #ececec;}
.item:last-child{border-bottom:none;}
.ic{flex:0 0 36px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;}
.ic svg{width:30px;height:30px;stroke:#000;fill:none;stroke-width:1.4;}
.txt h3{font-family:'ArticulatCF',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.3px;font-size:13px;line-height:1.2;margin-bottom:3px;}
.txt p{font-size:13px;line-height:1.45;text-wrap:pretty;}
@media(min-width:760px){
  .wrap{padding:52px 20px;}
  .strip{grid-template-columns:repeat(3,1fr);}
  .item{flex-direction:column;text-align:center;gap:12px;padding:30px 18px;border-bottom:none;border-right:1px solid #ececec;}
  .item:last-child{border-right:none;}
  .ic{width:40px;height:40px;flex-basis:40px;}
  .ic svg{width:34px;height:34px;}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="strip">
    <div class="item">
      <span class="ic" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="2.5" y="6.5" width="19" height="13" rx="1.5"/><line x1="2.5" y1="10.5" x2="21.5" y2="10.5"/><line x1="6" y1="15.5" x2="11" y2="15.5"/></svg>
      </span>
      <div class="txt">
        <h3>Pay over time</h3>
        <p>4 interest-free installments of $7.00 with Shop Pay.</p>
      </div>
    </div>
    <div class="item">
      <span class="ic" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M2.5 7.5h10v8h-10z"/><path d="M12.5 10.5h4l3 3v2h-7z"/><circle cx="6.5" cy="17" r="1.8"/><circle cx="16.5" cy="17" r="1.8"/></svg>
      </span>
      <div class="txt">
        <h3>Free shipping over $55</h3>
        <p>Free shipping on US orders over $55.</p>
      </div>
    </div>
    <div class="item">
      <span class="ic" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M7 8.5l-3 3 3 3"/><path d="M4 11.5h11a4 4 0 0 1 4 4v1"/></svg>
      </span>
      <div class="txt">
        <h3>Free &amp; easy returns</h3>
        <p>Free returns within 30 days, plus free shade matching.</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
