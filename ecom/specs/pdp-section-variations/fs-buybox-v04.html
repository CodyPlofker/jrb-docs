<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FS Buybox v04 — Editorial</title>
<style>
@font-face{font-family:'Canela';src:url('https://jrb-fonts-cdn.vercel.app/fonts/Canela-Light.otf') format('opentype');font-weight:300;font-display:swap;}
@font-face{font-family:'RingsideWideWeb';src:url('https://jrb-fonts-cdn.vercel.app/fonts/RingsideWide-Book_Web.ttf') format('truetype');font-weight:400;font-display:swap;}
@font-face{font-family:'BaseMonoWideWeb';src:url('https://jrb-fonts-cdn.vercel.app/fonts/BaseMonoWideThin_6014.ttf') format('truetype');font-weight:400;font-display:swap;}
@font-face{font-family:'GeogrotesqueCondBoldWeb';src:url('https://jrb-fonts-cdn.vercel.app/fonts/Geogrotesque.ttf') format('truetype');font-weight:700;font-display:swap;}
@font-face{font-family:'ArticulatCF';src:url('https://jrb-fonts-cdn.vercel.app/fonts/ArticulatCF-DemiBold.otf') format('opentype');font-weight:600;font-display:swap;}
@font-face{font-family:'ArticulatCF';src:url('https://jrb-fonts-cdn.vercel.app/fonts/ArticulatCF-Bold.otf') format('opentype');font-weight:700;font-display:swap;}

*{box-sizing:border-box;margin:0;padding:0;}
body{background:#fff;color:#000;font-family:'RingsideWideWeb',sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;}
.wrap{max-width:760px;margin:0 auto;padding:36px 20px 60px;}

/* dream-outcome editorial headline */
.eyebrow{font-family:'GeogrotesqueCondBoldWeb',sans-serif;text-transform:uppercase;letter-spacing:1px;font-size:12px;text-align:center;margin-bottom:14px;}
.dream{font-family:'Canela',serif;font-weight:300;font-size:clamp(34px,7vw,52px);line-height:1.08;text-align:center;text-wrap:balance;margin:0 auto 22px;max-width:14ch;}

/* full-bleed image */
.hero{width:100%;aspect-ratio:4/5;max-height:62vh;object-fit:cover;display:block;border-radius:3px;background:#f8f8f8;}

/* inline ruled chip row */
.exp{display:flex;justify-content:center;flex-wrap:wrap;align-items:center;gap:0;border-top:1px solid #e3e3e3;border-bottom:1px solid #e3e3e3;margin:22px 0;padding:14px 0;}
.exp span{font-family:'ArticulatCF';font-weight:700;text-transform:uppercase;letter-spacing:.3px;font-size:12px;padding:0 18px;}
.exp span + span{border-left:1px solid #e3e3e3;}

/* compact buy box */
.box{max-width:460px;margin:0 auto;text-align:center;}
.pname{font-family:'GeogrotesqueCondBoldWeb',sans-serif;text-transform:uppercase;font-size:22px;letter-spacing:1.18px;line-height:1.1;margin-bottom:8px;}
.rating{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px;}
.stars{display:inline-flex;gap:2px;}
.stars svg{width:16px;height:16px;}
.rcount{font-family:'RingsideWideWeb';font-size:14px;}
.price{font-family:'RingsideWideWeb';font-size:20px;margin-bottom:18px;}

.shade-head{display:flex;justify-content:center;gap:8px;align-items:baseline;margin:0 0 12px;}
.shade-label{font-family:'ArticulatCF';font-weight:700;text-transform:uppercase;letter-spacing:.3px;font-size:12px;}
.shade-current{font-family:'RingsideWideWeb';font-size:13px;}
.swatches{display:grid;grid-template-columns:repeat(10,1fr);gap:9px;max-width:380px;margin:0 auto;}
.sw{width:28px;height:28px;border-radius:100%;border:1px solid #d4d4d4;padding:2px;cursor:pointer;background:none;display:flex;align-items:center;justify-content:center;}
.sw.sel{border-color:#000;border-width:1.5px;}
.sw i{display:block;width:24px;height:24px;border-radius:100%;}

.atc{display:flex;align-items:center;justify-content:center;width:100%;height:44px;background:#000;color:#fff;border:none;border-radius:3px;font-family:'BaseMonoWideWeb';text-transform:uppercase;font-size:13px;letter-spacing:.5px;cursor:pointer;margin-top:22px;}
.atc .pipe{opacity:.45;margin:0 12px;}
.note{font-family:'RingsideWideWeb';font-size:12px;text-align:center;margin-top:10px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Foundation Stick</div>
  <h2 class="dream">Looks and feels like your best skin.</h2>

  <img class="hero" id="hero" src="https://cdn.shopify.com/s/files/1/0424/9527/9254/files/FS_-_PDP_-_57.jpg?v=1778074322&width=900" alt="Your Skin Foundation Stick">

  <!-- INLINE RULED CHIP ROW -->
  <div class="exp">
    <span>Medium-to-full, buildable</span>
    <span>Natural skin finish</span>
    <span>Built for on-the-go</span>
  </div>

  <!-- COMPACT BUY BOX -->
  <div class="box">
    <h1 class="pname">Your Skin Foundation Stick</h1>
    <div class="rating">
      <span class="stars" id="stars"></span>
      <span class="rcount">457 reviews &middot; 4.67&#9733;</span>
    </div>
    <div class="price">$38.00</div>

    <div class="shade-head">
      <span class="shade-label">Shade</span>
      <span class="shade-current" id="shadeCur">Ivory &mdash; 30 available</span>
    </div>
    <div class="swatches" id="sw"></div>

    <button class="atc">Add to bag<span class="pipe">|</span>$38.00</button>
    <p class="note">Free shipping over $50 &middot; Easy returns</p>
  </div>
</div>

<script>
var SH=[["Pale Alabaster","#f6e2d2","FS_-_PDP_-_1.jpg?v=1777924896"],["Alabaster","#f3ddc9","FS_-_PDP_-_10.jpg?v=1777925395"],["Bisque","#f0d8c2","FS_-_PDP_-_19.jpg?v=1777991567"],["Linen","#eed3bb","FS_-_PDP_-_28.jpg?v=1777991768"],["Warm Linen","#ecceb4","FS_-_PDP_-_29.jpg?v=1777991792"],["Porcelain","#eacdb6","FS_-_PDP_-_55.jpg?v=1777991814"],["Fair","#e8c8af","FS_-_PDP_-_56.jpg?v=1778074299"],["Neutral Fair","#e6c5ab","FS_-_PDP_-_55_1.jpg?v=1778074281"],["Ivory","#e4c1a4","FS_-_PDP_-_57.jpg?v=1778074322"],["Light","#e0bb9c","FS_-_PDP_-_82.jpg?v=1778074341"],["Sand","#dcb593","FS_-_PDP_-_83.jpg?v=1778074361"],["Beige","#d8af8b","FS_-_PDP_-_84.jpg?v=1778074380"],["Warm Beige","#d3a884","FS_-_PDP_-_109.jpg?v=1778074399"],["Neutral Beige","#cfa37c","FS_-_PDP_-_110.jpg?v=1778074448"],["Medium","#cb9d74","FS_-_PDP_-_111.jpg?v=1778074466"],["Warm Medium","#c5966c","FS_-_PDP_-_136.jpg?v=1778074517"],["Neutral Medium","#bf8f64","FS_-_PDP_-_141.jpg?v=1778074535"],["Neutral Honey","#b98860","FS_-_PDP_-_146_2.jpg?v=1778074627"],["Medium Honey","#b3825b","FS_-_PDP_-_137.jpg?v=1778074645"],["Honey","#ac7b55","FS_-_PDP_-_142.jpg?v=1778074662"],["Warm Honey","#a5744f","FS_-_PDP_-_147_1.jpg?v=1778075035"],["Golden","#9e6d49","FS_-_PDP_-_138.jpg?v=1778075124"],["Hazelnut","#946542","FS_-_PDP_-_143.jpg?v=1778075141"],["Pecan","#8a5d3b","FS_-_PDP_-_139.jpg?v=1778075176"],["Almond","#7f5535","FS_-_PDP_-_139_1.jpg?v=1778075205"],["Walnut","#724b2e","FS_-_PDP_-_144_1.jpg?v=1778075345"],["Cinnamon","#664229","FS_-_PDP_-_149.jpg?v=1778075361"],["Chestnut","#583922","FS_-_PDP_-_140.jpg?v=1778075377"],["Deep","#49301c","FS_-_PDP_-_145.jpg?v=1778075391"],["Espresso","#392515","FS_-_PDP_-_150.jpg?v=1778075404"]];
var BASE='https://cdn.shopify.com/s/files/1/0424/9527/9254/files/';
var star='<svg viewBox="0 0 24 24" fill="#000"><path d="M12 2l2.9 6.3 6.9.6-5.2 4.5 1.6 6.7L12 17l-6.2 3.6 1.6-6.7L2.2 8.9l6.9-.6z"/></svg>';
document.getElementById('stars').innerHTML=star.repeat(4)+'<svg viewBox="0 0 24 24"><defs><linearGradient id="h4"><stop offset="67%" stop-color="#000"/><stop offset="67%" stop-color="#fff"/></linearGradient></defs><path d="M12 2l2.9 6.3 6.9.6-5.2 4.5 1.6 6.7L12 17l-6.2 3.6 1.6-6.7L2.2 8.9l6.9-.6z" fill="url(#h4)" stroke="#000"/></svg>';
var sw=document.getElementById('sw');
SH.forEach(function(s,i){var b=document.createElement('button');b.className='sw'+(i===8?' sel':'');b.innerHTML='<i style="background:'+s[1]+'"></i>';b.title=s[0];b.onclick=function(){document.querySelectorAll('.sw').forEach(function(x){x.classList.remove('sel')});b.classList.add('sel');document.getElementById('shadeCur').textContent=s[0]+' — 30 available';document.getElementById('hero').src=BASE+s[2]+'&width=900';};sw.appendChild(b);});
</script>
</body>
</html>
