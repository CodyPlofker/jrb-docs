<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FS Value Props v01 — 3-icon value strip</title>
<style>
@font-face{font-family:'Canela';src:url('https://jrb-fonts-cdn.vercel.app/fonts/Canela-Light.otf') format('opentype');font-weight:300;font-display:swap;}
@font-face{font-family:'RingsideWideWeb';src:url('https://jrb-fonts-cdn.vercel.app/fonts/RingsideWide-Book_Web.ttf') format('truetype');font-weight:400;font-display:swap;}
@font-face{font-family:'BaseMonoWideWeb';src:url('https://jrb-fonts-cdn.vercel.app/fonts/BaseMonoWideThin_6014.ttf') format('truetype');font-weight:400;font-display:swap;}
@font-face{font-family:'GeogrotesqueCondBoldWeb';src:url('https://jrb-fonts-cdn.vercel.app/fonts/Geogrotesque.ttf') format('truetype');font-weight:700;font-display:swap;}
@font-face{font-family:'ArticulatCF';src:url('https://jrb-fonts-cdn.vercel.app/fonts/ArticulatCF-DemiBold.otf') format('opentype');font-weight:600;font-display:swap;}
@font-face{font-family:'ArticulatCF';src:url('https://jrb-fonts-cdn.vercel.app/fonts/ArticulatCF-Bold.otf') format('opentype');font-weight:700;font-display:swap;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#fff;color:#000;font-family:'RingsideWideWeb',sans-serif;font-size:16px;-webkit-font-smoothing:antialiased;}
.wrap{max-width:1080px;margin:0 auto;padding:44px 20px;}
.eyebrow{font-family:'GeogrotesqueCondBoldWeb',sans-serif;text-transform:uppercase;letter-spacing:1px;font-size:12px;text-align:center;margin-bottom:8px;}
h2{font-family:'Canela',serif;font-weight:300;font-size:30px;line-height:1.12;text-align:center;text-wrap:balance;margin-bottom:28px;}
.strip{display:grid;grid-template-columns:1fr;gap:0;border:1px solid #e5e5e5;border-radius:3px;overflow:hidden;}
.cell{display:flex;align-items:center;gap:16px;padding:20px 22px;border-bottom:1px solid #ececec;}
.cell:last-child{border-bottom:none;}
.ico{flex-shrink:0;width:34px;height:34px;display:flex;align-items:center;justify-content:center;}
.ico svg{width:30px;height:30px;stroke:#000;fill:none;stroke-width:1.4;}
.txt .t{font-family:'ArticulatCF',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.3px;font-size:13.5px;line-height:1.2;margin-bottom:4px;}
.txt .d{font-family:'RingsideWideWeb',sans-serif;font-size:13px;line-height:1.45;text-wrap:pretty;}
@media(min-width:760px){
  .wrap{padding:56px 20px;}
  h2{font-size:36px;margin-bottom:36px;}
  .strip{grid-template-columns:repeat(3,1fr);}
  .cell{flex-direction:column;text-align:center;gap:14px;padding:32px 26px;border-bottom:none;border-right:1px solid #ececec;}
  .cell:last-child{border-right:none;}
  .ico{width:40px;height:40px;}
  .ico svg{width:36px;height:36px;}
}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Easy to buy, easy to love</p>
  <h2>Try it with nothing to lose</h2>
  <div class="strip">
    <div class="cell">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="1.5"/><line x1="2.5" y1="10" x2="21.5" y2="10"/></svg>
      </span>
      <div class="txt">
        <p class="t">Pay over time with Shop Pay</p>
        <p class="d">Split it into interest-free installments at checkout.</p>
      </div>
    </div>
    <div class="cell">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M2.5 7h11v8.5h-11z"/><path d="M13.5 10h4l3 3v2.5h-7z"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>
      </span>
      <div class="txt">
        <p class="t">Free shipping over $55</p>
        <p class="d">On US orders. Add a Miracle Balm and you're there.</p>
      </div>
    </div>
    <div class="cell">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 9a8 8 0 1 1 .8 7"/><polyline points="4 4 4 9 9 9"/></svg>
      </span>
      <div class="txt">
        <p class="t">Free &amp; easy returns</p>
        <p class="d">Free returns and exchanges within 30 days.</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
