<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review queue — 3 templates &middot; 9 ads</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #f0f0f0; color: #111; padding: 32px 24px 80px; }
  header { max-width: 1100px; margin: 0 auto 40px; display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  header h1 { font-size: 22px; font-weight: 600; }
  header p { font-size: 13px; color: #888; }
  .template-group { max-width: 1100px; margin: 0 auto 48px; }
  .template-group h2 { font-size: 14px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .06em; color: #555; margin-bottom: 16px; padding-bottom: 8px;
    border-bottom: 1px solid #ddd; }
  .fresh-pill { background: #1a8a1a; color: #fff; font-size: 10px; font-weight: 700;
    letter-spacing: .06em; padding: 2px 7px; border-radius: 3px; margin-left: 10px;
    vertical-align: middle; }
  .variants { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .card { background: #fff; border-radius: 10px; overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .card.fresh { box-shadow: 0 0 0 2px #1a8a1a, 0 1px 4px rgba(0,0,0,.08); }
  .card img { width: 100%; display: block; }
  figcaption { font-size: 11px; color: #999; padding: 8px 12px 10px;
    font-family: ui-monospace, monospace; display: flex; align-items: center; gap: 6px;
    white-space: nowrap; overflow: hidden; }
  figcaption .age { margin-left: auto; color: #bbb; flex-shrink: 0; }
  .card.fresh figcaption .age { color: #1a8a1a; font-weight: 700; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #ddd; flex-shrink: 0; }
  .fresh-dot { background: #1a8a1a; }
  .badge { display: inline-block; background: #000; color: #fff; font-size: 11px;
    font-weight: 600; letter-spacing: .05em; padding: 3px 8px; border-radius: 4px;
    margin-left: 10px; vertical-align: middle; }
</style>
</head>
