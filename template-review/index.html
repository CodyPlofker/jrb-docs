  .variants { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  figure { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  figure img { width: 100%; display: block; }
  figcaption { font-size: 11px; color: #999; padding: 8px 12px 10px;
    font-family: ui-monospace, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { display: inline-block; background: #000; color: #fff; font-size: 11px;
