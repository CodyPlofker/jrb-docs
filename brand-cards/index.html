<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JRB Brand Reference Cards</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #f0f0f0; padding: 40px 24px; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom 8px; }
  p { font-size: 13px; color: #888; margin-bottom: 32px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(540px, 1fr)); gap: 24px; max-width: 1200px; }
  figure { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  figure img { width: 100%; display: block; }
  figcaption { font-size: 13px; color: #555; padding: 12px 16px; font-weight: 600; }
</style>
</head>
<body>
<h1>JRB Brand Reference Cards</h1>
<p>Upload these to gpt-image-2 or Nano Banana 2 as reference images alongside the product packshot.</p>
<div class="grid">
  <figure>
    <img src="jrb-brand-spec-card.png" alt="Brand Spec Card">
    <figcaption>Brand Spec Card — fonts, colors, design rules, CTA style</figcaption>
  </figure>
  <figure>
    <img src="jrb-visual-style-card.png" alt="Visual Style Card">
    <figcaption>Visual Style Card — brand essence, photography direction, mood spectrum</figcaption>
  </figure>
</div>
</body>
</html>
